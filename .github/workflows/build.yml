name: Build PDF Reader.exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install add-ons
        run: python -m pip install pymupdf pywin32 pyinstaller
      - name: Build the exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "PDF Reader" --hidden-import win32com.client --hidden-import pythoncom PDFReader.py
      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Reader
          path: dist/PDF Reader.exe
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDF Reader ${{ github.run_number }}
          body: Download "PDF.Reader.exe" below and double-click it. No installation needed.
          files: dist/PDF Reader.exe
